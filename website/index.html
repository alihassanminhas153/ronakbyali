    <!-- Apply saved/system theme before first paint (prevents a light flash in dark mode) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ronak-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
